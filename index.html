// generowanie cegie³ek
function generujPoziom(numerPoziomu) {
    cegielki = []; // Czyœcimy star¹ tablicê klocków
    let mapa = mapyPoziomow[numerPoziomu];

    for (let c = 0; c < liczbaKolumn; c++) {
        cegielki[c] = [];
        for (let r = 0; r < liczbaWierszy; r++) {
            let ceglaX = c * (szerokoscCegly + odstepCegly) + marginesLewy;
            let ceglaY = r * (wysokoscCegly + odstepCegly) + marginesGorny;

            // Pobieramy ¿ycie z naszej mapy (rz¹d r, kolumna c)
            let zyciaZMapy = mapa[r][c];

            cegielki[c][r] = {
                x: ceglaX,
                y: ceglaY,
                zycia: zyciaZMapy // Jeœli w mapie jest 0, klocek od razu bêdzie "martwy"
            };
        }
    }
	canvas.style.backgroundImage = `url('${tlaPoziomow[numerPoziomu]}')`;
	canvas.style.backgroundSize = 'cover'; // ¯eby ³adnie rozci¹ga³o
}

}, { passive: false });

// 2. P£YNNE STEROWANIE PALETK¥ PRZY RUCHU (touchmove)
canvas.addEventListener('touchmove', function(event) {
    event.preventDefault();

    if (stanGry !== 'GRA') return;

    const rect = canvas.getBoundingClientRect();
    let skalaX = canvas.width / rect.width;
    
    // POPRAWKA: U¿ywamy event.touches[0] dla stabilnego odczytu na iOS/Android
    let touch = event.touches[0];
    let dotykX = (touch.clientX - rect.left) * skalaX;

    xP = dotykX - (szerokoscPaletki / 2);

    if (xP < 0) xP = 0;
    if (xP > canvas.width - szerokoscPaletki) xP = canvas.width - szerokoscPaletki;
}, { passive: false });

// 3. ZABEZPIECZENIE: Obs³uga zakoñczenia dotyku (touchend)
canvas.addEventListener('touchend', function(event) {

}, { passive: false });



/////////////////// FUNKCJA ANIMACJA
function animacja() {
	if (czyPauza) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.005)'; // Pó³przezroczyste czarne t³o (przyciemnienie gry)
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'white';
        ctx.font = 'bold 50px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('PAUZA', canvas.width / 2, canvas.height / 2);

        // WA¯NE: Prosimy o kolejn¹ klatkê, ¿eby komputer ca³y czas nas³uchiwa³, 
        // czy nie wciœniesz "P" ponownie, aby odblokowaæ grê!
        requestAnimationFrame(animacja);
        return; // Przerywamy wykonywanie dalszej czêœci funkcji (kulki stoj¹ w miejscu!)
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height); // czyœæ ekran

    // P³ynny ruch paletki
    if (prawoWcisniete) xP += predkosc;
    if (lewoWcisniete)  xP -= predkosc;

    if (xP > canvas.width - szerokoscPaletki) xP = canvas.width - szerokoscPaletki;
    if (xP < 0) xP = 0;
	// kulka na paletce
    // A) NA POCZ¥TKU pêtli animacja() - aktualizacja pozycji przyklejonych kulek
    if (czyKulkaNaPaletce) {
        for (let j = 0; j < kulki.length; j++) {
            let k = kulki[j];
            // Jeœli kulka stoi w miejscu (jest przyklejona)
            if (k.predkoscX === 0 && k.predkoscY === 0) {
                // Jeœli jakimœ cudem nie ma jeszcze offsetu (np. na samym starcie gry), dajemy œrodek
                if (k.klejOffset === undefined) {
                    k.klejOffset = szerokoscPaletki / 2;
                }
                // Kulka jedzie dok³adnie tam, gdzie siê przyklei³a wzglêdem xP
                k.x = xP + k.klejOffset;
                k.y = yP - k.promien;
            }
        }
    }

	
    obslugaBonusow();
	obslugaLaserow();
    rysujCegielki();
    Paletka();

    // Pêtla dla obs³ugi ruchu i kolizji kulek
    for (let i = kulki.length - 1; i >= 0; i--) {
        let k = kulki[i];
        
        // Zatrzymanie ruchu kulek po wygranej/przegranej
        if (!czyWygrana && !czyKoniecGry) {
            k.x += k.predkoscX;
            k.y += k.predkoscY;
        }

        sprawdzKolizjeZCegielkami(k); 

		// Prawa œciana
        if (k.x + k.promien > canvas.width) {
            k.x = canvas.width - k.promien; // ?? WYPYCHANIE: Ustawiamy kulkê idealnie przy krawêdzi
            k.predkoscX *= -(1+przyspieszenie);               // Odwracamy kierunek
            odtworzDzwiek(330);
        }
        
        // Lewa œciana
        if (k.x - k.promien < 0) {
            k.x = k.promien;                // ?? WYPYCHANIE: Ustawiamy kulkê idealnie przy krawêdzi
            k.predkoscX *= -(1+przyspieszenie);  
				if (k.predkoscY < 0.1 && k.predkoscY > -0.1) {
					k.predkoscY *=2
					}// Odwracamy kierunek
            odtworzDzwiek(330);
        }
        
        // Górna œciana (Sufit)
        if (k.y - k.promien < 40) {
            k.y = k.promien+40;                // ?? WYPYCHANIE: Ustawiamy kulkê idealnie przy krawêdzi
            k.predkoscY *= -(1+przyspieszenie);               // Odwracamy kierunek
            odtworzDzwiek(330);
        }

        // --- Odbijanie od paletki ---
        // --- Odbijanie od paletki (wewn¹trz pêtli for dla kulek w animacja()) ---
        if (!czyKulkaNaPaletce && k.y + k.promien >= yP && k.y < yP + 40 && k.x >= xP && k.x <= xP + szerokoscPaletki) {
            
            if (trybKlejacy) {
                // ?? EFEKT KLEJU: Kulka przykleja siê do paletki!
                czyKulkaNaPaletce = true;
                k.predkoscX = 0;
                k.predkoscY = 0;
				// Zapamiêtujemy odleg³oœæ kulki od LEWEJ krawêdzi paletki
                k.klejOffset = k.x - xP; 
                odtworzDzwiek(180); // Niski, magnetyczny dŸwiêk z³apania
            } else {
                // STANDARDOWE ODBICIE K¥TAMI (Twój dotychczasowy kod)
                let punktTrafienia = k.x - (xP + (szerokoscPaletki / 2));
                let znormalizowaneTrafienie = punktTrafienia / (szerokoscPaletki / 2);
                let katOdbicia = znormalizowaneTrafienie * (Math.PI / 3);
                let aktualnaPredkosc = Math.sqrt(k.predkoscX ** 2 + k.predkoscY ** 2);

                k.predkoscX = aktualnaPredkosc * Math.sin(katOdbicia);
                k.predkoscY = -aktualnaPredkosc * Math.cos(katOdbicia);
                odtworzDzwiek(220);
            }
        }


        // --- SPADEK W PRZEPAŒÆ ---
        if (k.y - k.promien > canvas.height) {
            kulki.splice(i, 1); // Usuwamy tê konkretn¹ kulkê

            // Jeœli to by³a OSTATNIA kulka na ekranie -> Przegrana!
            if (kulki.length === 0 && !czyWygrana) {
				zycia--;
				
                if (zycia > 0) {
            // Reaktywujemy jedn¹ kulkê na paletce
            czyKulkaNaPaletce = true;
            kulki.push({
                x: xP + szerokoscPaletki / 2,
                y: yP - 15,
                predkoscX: 0,
                predkoscY: 0,
                promien: 15
            });
			} else {
            czyKoniecGry = true; // Prawdziwy koniec gry po stracie 3 ¿yæ
			}
		}	
           continue;
        }
    }

    rysujKulki();
    sprawdzCzyKlockiZostaly();
    rysujWynik();

    requestAnimationFrame(animacja);
}

function rysujKulki() {
    ctx.fillStyle = 'black';
    for (let i = 0; i < kulki.length; i++) {
        let k = kulki[i];
        let obrazekK = imgKulka;
        ctx.drawImage(obrazekK, k.x-15, k.y-15, k.promien * 2, k.promien * 2);
    }
}

function Paletka() {
    ctx.fillStyle = trybLaserowy ? '#a040ff' : 'blue'; // Fioletowa, gdy strzela!
    ctx.fillRect(xP, yP, szerokoscPaletki, 40);
}


function rysujCegielki() {
    const grafikiCegiel = [null, imgCeglaZielona, imgCeglaPomaranczowa, imgCeglaCzerwona, imgCeglaNiebieska, imgCeglaFioletowa];
    grafikiCegiel[99] = imgCeglaStalowa;
	for (let c = 0; c < liczbaKolumn; c++) {
        for (let r = 0; r < liczbaWierszy; r++) {
            let b = cegielki[c][r];
            if (b && b.zycia > 0 && grafikiCegiel[b.zycia]) {
				let obrazek = grafikiCegiel[b.zycia];
                ctx.drawImage(obrazek, b.x, b.y, szerokoscCegly, wysokoscCegly);
            }
        }
    }
}
function obslugaLaserow() {
    for (let i = pociski.length - 1; i >= 0; i--) {
        let p = pociski[i];
        
        // 1. Ruch lasera w górê
        p.y += p.predkoscY;
        
        // 2. Rysowanie lasera jako fioletowy œwiec¹cy pasek
        ctx.fillStyle = '#a040ff';
        ctx.fillRect(p.x, p.y, p.szerokosc, p.wysokosc);
        
        // 3. Kolizja z cegie³kami
        for (let c = 0; c < liczbaKolumn; c++) {
            for (let r = 0; r < liczbaWierszy; r++) {
                let b = cegielki[c][r];
                
                if (b && b.zycia > 0) {
                    // Sprawdzamy prostok¹tn¹ kolizjê pocisku z klockiem
                    if (
                        p.x + p.szerokosc > b.x &&
                        p.x < b.x + szerokoscCegly &&
                        p.y + p.wysokosc > b.y &&
                        p.y < b.y + wysokoscCegly
                    ) {
                        // Trafienie!
                        if (b.zycia !== 99) { // Stal jest odporna na lasery!
                            b.zycia--;
                            if (b.zycia === 0) punkty++;
                        }
                        
                        odtworzDzwiek(480);
                        pociski.splice(i, 1); // Usuwamy pocisk z ekranu
                        return; // Przerywamy sprawdzanie dla tego pocisku
                    }
                }
            }
        }
        
        // 4. Usuwanie pocisków, które wylecia³y za górn¹ krawêdŸ ekranu
        if (p.y < 0) {
            pociski.splice(i, 1);
        }
    }
}


function sprawdzKolizjeZCegielkami(k) {
    for (let c = 0; c < liczbaKolumn; c++) {
        for (let r = 0; r < liczbaWierszy; r++) {
            let b = cegielki[c][r];

            if (b.zycia > 0) {
                if (
                    k.x + k.promien > b.x &&
                    k.x - k.promien < b.x + szerokoscCegly &&
                    k.y + k.promien > b.y &&
                    k.y - k.promien < b.y + wysokoscCegly
                ) {
                    // 2. OBLICZAMY G£ÊBOKOŒÆ WNIKANIA Z KA¯DEJ STRONY
                    // Ile kulka wesz³a w klocek od lewej, prawej, góry i do³u
                    let wejscieZLewej   = (k.x + k.promien) - b.x;
                    let wejscieZPrawej  = (b.x + szerokoscCegly) - (k.x - k.promien);
                    let wejscieZGory    = (k.y + k.promien) - b.y;
                    let wejscieZDolu    = (b.y + wysokoscCegly) - (k.y - k.promien);

                    // Szukamy najmniejszej wartoœci — to ona wskazuje œcianê, w któr¹ uderzyliœmy!
                    let minX = Math.min(wejscieZLewej, wejscieZPrawej);
                    let minY = Math.min(wejscieZGory, wejscieZDolu);
					
                    if (minX < minY) {
                        // Uderzenie w BOK klocka (wnikniêcie X jest mniejsze ni¿ Y)
                        k.predkoscX *= -(1+przyspieszenie); 
							if (wejscieZLewej < wejscieZPrawej) {
                            k.x -= minX; // Wypchnij w lewo
							} else {
                            k.x += minX; // Wypchnij w prawo
							}
						
                    } else {
                        // Uderzenie w GÓRÊ lub DÓ£ klocka
                        k.predkoscY *= -(1+przyspieszenie); 
							if (wejscieZGory < wejscieZDolu) {
                            k.y -= minY; // Wypchnij w górê
							} else {
                            k.y += minY; // Wypchnij w dó³
							}
                    }
					if (b.zycia !== 99) {
                    b.zycia--;
					odtworzDzwiek(440);
						if (b.zycia === 0) {
                        punkty++;
						if (punkty > najlepszyWynik) {
								najlepszyWynik = punkty;
								// Zapisujemy nowy rekord na sta³e w pamiêci przegl¹darki!
								localStorage.setItem('arkanoidHighScore', najlepszyWynik);
							}

							// 25% szans na wypadniêcie bonusu
                        if (Math.random() < 0.25) {
                            let losSzansy = Math.random(); // Losuje liczbê od 0.0 do 1.0
                            let wybranyTyp = '';
                            let kolorBonusu = '';
                            
                            // 1. DU¯A PALETKA (19% szans -> przedzia³ 0.00 - 0.19)
                            if (losSzansy < 0.19) {
                                wybranyTyp = 'duzaPaletka';
                                kolorBonusu = '#000080'; // Granatowy
                            } 
                            // 2. MA£A PALETKA (15% szans -> przedzia³ 0.19 - 0.34)
                            else if (losSzansy < 0.34) {
                                wybranyTyp = 'malaPaletka';
                                kolorBonusu = '#00d2ff'; // B³êkitny
                            } 
                            // 3. WOLNA KULKA (15% szans -> przedzia³ 0.34 - 0.49)
                            else if (losSzansy < 0.49) {
                                wybranyTyp = 'wolnaKulka';
                                kolorBonusu = '#f5f5dc'; // Be¿owy
                            } 
                            // 4. TRZY KULKI (15% szans -> przedzia³ 0.49 - 0.64)
                            else if (losSzansy < 0.64) {
                                wybranyTyp = 'trzyKulki';
                                kolorBonusu = '#ff7f50'; // Pomarañczowy
                            } 
                            // 5. KLEJ¥CA PALETKA (15% szans -> przedzia³ 0.64 - 0.79)
                            else if (losSzansy < 0.79) {
                                wybranyTyp = 'klejacaPaletka';
                                kolorBonusu = '#2ed573'; // Zielony
                            } 
                            // 6. EXTRA ¯YCIE (1% szans -> przedzia³ 0.79 - 0.80)
                            else if (losSzansy < 0.80) {
                                wybranyTyp = 'extraZycie';
                                kolorBonusu = '#ffa502'; // Z³oty
                            } 
                            // 7. LASEROWA PALETKA (Pozosta³e 20% szans -> przedzia³ 0.80 - 1.00)
                            else {
                                wybranyTyp = 'laserowaPaletka';
                                kolorBonusu = '#a040ff'; // Fioletowy
                            }

                            // Wrzucamy wylosowan¹ pigu³kê do tablicy spadaj¹cych bonusów
                            bonusy.push({
                                x: b.x + szerokoscCegly / 2,
                                y: b.y,
                                promien: 10,
                                predkoscY: 3,
                                typ: wybranyTyp,
                                kolor: kolorBonusu
                            });
                        }

						}
						return;
					}
				}
            }
        }
    }
}

function obslugaBonusow() {
    if (czyWygrana || czyKoniecGry) return;

    for (let i = bonusy.length - 1; i >= 0; i--) {
        let bon = bonusy[i];
        bon.y += bon.predkoscY;

        ctx.beginPath();
        ctx.arc(bon.x, bon.y, bon.promien, 0, 2 * Math.PI);
        ctx.fillStyle = bon.kolor;
        ctx.fill();
        ctx.closePath();

        // KOLIZJA: Czy paletka z³apa³a bonus?
        if (bon.y + bon.promien >= yP && bon.y <= yP + 40 && bon.x >= xP && bon.x <= xP + szerokoscPaletki) {
            
            if (bon.typ === 'duzaPaletka') {
                if (szerokoscPaletki < 350) {
                    szerokoscPaletki += 40;
                    setTimeout(function() { szerokoscPaletki -= 40; }, 10000);
                }
            } 
            else if (bon.typ === 'wolnaKulka') {
                for (let j = 0; j < kulki.length; j++) {
                    kulki[j].predkoscX *= 0.6;
                    kulki[j].predkoscY *= 0.6;
                }
                setTimeout(function() {
                    for (let j = 0; j < kulki.length; j++) {
                        kulki[j].predkoscX /= 0.65;
                        kulki[j].predkoscY /= 0.65;
                    }
                }, 10000);
            } 
            else if (bon.typ === 'trzyKulki') {
                if (kulki.length > 0) {
                    // Bierzemy pierwsz¹ lataj¹c¹ kulkê jako bazê (matkê)
                    let baza = kulki[0]; 
                    
                    // 1. Wyliczamy ca³kowit¹ prêdkoœæ wypadkow¹ kulki-bazy
                    let aktualnaPredkosc = Math.sqrt(baza.predkoscX ** 2 + baza.predkoscY ** 2);
                    
                    // 2. Wyliczamy aktualny k¹t lotu kulki-bazy za pomoc¹ funkcji Math.atan2
                    let aktualnyKat = Math.atan2(baza.predkoscY, baza.predkoscX);
                    
                    // 3. Definiujemy k¹t rozwarcia: 30 stopni w radianach to Math.PI / 6
                    let katRozwarcia = Math.PI / 6;

                    // --- KULKA NUMER 2 (Skrêca o 30 stopni w lewo) ---
                    let katLewo = aktualnyKat - katRozwarcia;
                    kulki.push({
                        x: baza.x,
                        y: baza.y,
                        predkoscX: aktualnaPredkosc * Math.cos(katLewo),
                        predkoscY: aktualnaPredkosc * Math.sin(katLewo),
                        promien: baza.promien
                    });

                    // --- KULKA NUMER 3 (Skrêca o 30 stopni w prawo) ---
                    let katPrawo = aktualnyKat + katRozwarcia;
                    kulki.push({
                        x: baza.x,
                        y: baza.y,
                        predkoscX: aktualnaPredkosc * Math.cos(katPrawo),
                        predkoscY: aktualnaPredkosc * Math.sin(katPrawo),
                        promien: baza.promien
                    });
                    
                    odtworzDzwiek(587); // Triumfalny dŸwiêk rozbicia na 3 kulki!
                }
            }
			else if (bon.typ === 'klejacaPaletka') {
                trybKlejacy = true;
                
                // Opcjonalnie: Wy³¹czamy magnes po 12 sekundach, ¿eby gra nie by³a za ³atwa
                setTimeout(function() {
                    trybKlejacy = false;
                }, 12000);
            }
			            else if (bon.typ === 'extraZycie') {
                // Dodajemy jedno ¿ycie do licznika gracza
                zycia++;
                
                // Odtwarzamy wyj¹tkowo wysoki, triumfalny dŸwiêk (jak moneta w Mario!)
                odtworzDzwiek(880); 
                
                // Ma³y trik: Mo¿esz te¿ na chwilê odtworzyæ drugi dŸwiêk zaraz po nim, 
                // tworz¹c klasyczne retro dwutonowe "brzdêk!"
                setTimeout(function() {
                    odtworzDzwiek(1320);
                }, 80);
            }
			else if (bon.typ === 'malaPaletka') {
                // Skracamy paletkê! (Pilnujemy, ¿eby nie by³a krótsza ni¿ np. 100px, 
                // bo wtedy gra sta³aby siê niemal niemo¿liwa)
                if (szerokoscPaletki > 100) {
                    szerokoscPaletki -= 40;
                    
                    // Po 8 sekundach przywracamy zabrane 40 pikseli
                    setTimeout(function() {
                        szerokoscPaletki += 40;
                    }, 8000);
                }
                
                // Smutny, opadaj¹cy dŸwiêk retro sygnalizuj¹cy utrudnienie
                odtworzDzwiek(180);
                setTimeout(function() { odtworzDzwiek(130); }, 100);
            }
			else if (bon.typ === 'laserowaPaletka') {
                trybLaserowy = true;
                
                // Po 9 sekundach dzia³ka laserowe znikaj¹
                setTimeout(function() {
                    trybLaserowy = false;
                }, 9000);
                
                odtworzDzwiek(440);
                setTimeout(function() { odtworzDzwiek(660); }, 80);
            }




            bonusy.splice(i, 1);
            continue;
        }

        if (bon.y > canvas.height) {
            bonusy.splice(i, 1);
        }
    }
}

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();
	
function odtworzDzwiek(czestotliwosc) {
    // Tworzymy systemowy kontekst audio

	
	if (audioCtx.state === 'suspended') {
    audioCtx.resume();
    }
    
    // Tworzymy oscylator (generator fali dŸwiêkowej) i wyciszenie
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    oscillator.type = 'triangle'; // Styl retro (trójk¹tna fala – brzmi jak GameBoy)
    oscillator.frequency.setValueAtTime(czestotliwosc, audioCtx.currentTime);
    
    // Szybkie wyciszenie dŸwiêku po 0.1 sekundy, ¿eby nie piszcza³o za d³ugo
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); // g³oœnoœæ 30%
    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
    
    // £¹czymy klocki i odpalamy
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.1);
}
